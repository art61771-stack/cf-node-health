[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cf-node-health"
version = "1.0.0"
description = "Private Quantumult X VLESS node health manager"
requires-python = ">=3.11"
dependencies = [
  "websocket-client>=1.8,<2",
  "cryptography>=42,<46",
  "requests>=2.31,<3",
]

[project.scripts]
cf-node-health = "cf_node_health.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
