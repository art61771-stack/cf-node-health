name: private-node-health

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force_replace_failed:
        description: Replace a node after this round's failure (still requires failed candidate test)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: private-node-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUBSCRIPTION_URL: ${{ secrets.SUBSCRIPTION_URL }}
      NODE_UUID: ${{ secrets.NODE_UUID }}
      MAINT_URL: ${{ secrets.MAINT_URL }}
      MAINT_TOKEN: ${{ secrets.MAINT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check websocket-client cryptography requests .
      - name: Run health manager
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_replace_failed }}" == "true" ]]; then
            args+=(--force-replace-failed)
          fi
          cf-node-health "${args[@]}"
      - name: Commit changed state and generated files
        shell: bash
        run: |
          set -euo pipefail
          git add data/state.json data/status.json
          if git diff --cached --quiet; then
            echo "No tracked health data changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update private node health state"
          git push
